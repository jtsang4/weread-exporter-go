name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The minimum Go version of go.mod: golangci-lint is a prebuilt binary that
      # cannot read the standard library of a Go release newer than itself, and
      # the vet and lint steps prove that the code compiles with the minimum.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need 'gofmt -s -w':"
            echo "$unformatted"
            exit 1
          fi

      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

      - name: Third-party notices are up to date
        run: make notices-check

      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh

      # Uses ShellCheck as well, for the scripts of the workflow steps.
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          # The race detector needs cgo and a C compiler: use it where that is
          # the default.
          - os: ubuntu-latest
            race: -race
          - os: macos-latest
            race: -race
          - os: windows-latest
            race: ""
    env:
      # The runners have Chrome; with this a missing browser fails the browser
      # tests instead of skipping them.
      WEREAD_TEST_REQUIRE_CHROME: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      - name: Browser version
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version
          else
            google-chrome --version
          fi

      - name: Test
        shell: bash
        run: go test ${{ matrix.race }} -count=1 -covermode=atomic -coverprofile=coverage.txt ./...

      - name: Coverage summary
        shell: bash
        run: go tool cover -func=coverage.txt | tail -n 1

  test-min-go:
    name: Test (minimum Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Go version
        run: go version

      - name: Test without a browser
        run: go test -short -count=1 ./...

  # The W3C's validator is the judge of what a valid EPUB is: every message of it,
  # warnings included, fails the test. It needs Java, which the runners have.
  epubcheck:
    name: EPUBCheck
    runs-on: ubuntu-latest
    env:
      EPUBCHECK_VERSION: "5.4.0"
      # sha256 of epubcheck-5.4.0.zip (the digest GitHub shows for the release asset)
      EPUBCHECK_SHA256: "33350c61038e71dfb3d45a76aed04bf5481e6d5500cb780f6e98db8bbd15a28c"
      # A missing validator fails the test instead of skipping it.
      WEREAD_TEST_REQUIRE_EPUBCHECK: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      - name: Install EPUBCheck
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/epubcheck.zip" \
            "https://github.com/w3c/epubcheck/releases/download/v${EPUBCHECK_VERSION}/epubcheck-${EPUBCHECK_VERSION}.zip"
          echo "${EPUBCHECK_SHA256}  ${RUNNER_TEMP}/epubcheck.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/epubcheck" <<EOF
          #!/bin/sh
          exec java -jar "$RUNNER_TEMP/epubcheck-${EPUBCHECK_VERSION}/epubcheck.jar" "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/bin/epubcheck"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: EPUBCheck version
        run: epubcheck --version

      - name: Validate the generated EPUBs
        run: go test ./internal/export -run '^TestEPUBPassesEPUBCheck$' -count=1 -v

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      # vet type-checks the tests of the target platform as well.
      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build -trimpath -ldflags "-s -w" -o "dist/weread-exporter_${GOOS}_${GOARCH}" ./cmd/weread-exporter

      - uses: actions/upload-artifact@v4
        with:
          name: weread-exporter-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 7

  release-check:
    name: GoReleaser snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Scans with the newest Go release, whose standard library has the fixes.
      - uses: golang/govulncheck-action@v1
        with:
          go-package: ./...

  ci-ok:
    name: CI passed
    if: always()
    needs: [lint, test, test-min-go, epubcheck, build, release-check, vulncheck]
    runs-on: ubuntu-latest
    steps:
      - name: Check the results of the jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "a job did not succeed"
              exit 1
            fi
          done
